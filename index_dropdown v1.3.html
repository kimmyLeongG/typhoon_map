/* === 工具 === */
function odvColor(v){
  if(v<=0) return '#ffffff';
  const t=Math.min(1,Math.max(0,v/8));
  const r=Math.round(255*(t<.5?0:2*t-1));
  const g=Math.round(255*(t<.5?2*t:2-2*t));
  const b=Math.round(255*(t<.25?1-4*t:0));
  return `rgb(${r},${g},${b})`;
}

    opt.value=f.name;

    opt.dataset.num=f.numFile;
    opt.textContent=f.name;
    sel.appendChild(opt);

/* === 載入並繪圖 === */
let gridGroup, txtGroup, circleGroup;
document.getElementById('loadBtn').addEventListener('click', () => {
  const opt = sel.selectedOptions[0];
  if(!opt.value){alert('請先選擇檔案');return;}
  Promise.all([
    fetch(opt.dataset.path).then(r=>r.text()),
    fetch(opt.dataset.num).then(r=>r.text())
  ]).then(([txt, num])=>draw(txt,num,opt.value));
});

/* === 繪圖核心 === */
function draw(txtData,numData,tag){
  // 清除舊圖層
  if(gridGroup) map.removeLayer(gridGroup);
  if(txtGroup)  map.removeLayer(txtGroup);
  if(circleGroup) map.removeLayer(circleGroup);

  // 解析 & 反轉 row（對齊 MATLAB）
  let txtGrid=txtData.trim().split('\n').map(r=>r.trim().split(/\s+/));
  let numGrid=numData.trim().split('\n').map(r=>r.trim().split(/\s+/).map(Number));
  txtGrid.reverse(); numGrid.reverse();
  if(txtGrid.length!==12||txtGrid[0].length!==15){alert('文字檔需 12×15');return;}
  if(numGrid.length!==12||numGrid[0].length!==15){alert('數值檔需 12×15');return;}

  // 白圈 & Macau
  circleGroup=L.layerGroup();
  const macau=[22.17,113.57];
  [100,200,400,600,800].forEach(km=>{
    L.circle(macau,{radius:km*1000,color:'white',weight:1,fill:false,dashArray:'6,6'}).addTo(circleGroup);
    const labelLat=22.17-km/111.32;
    L.marker([labelLat,113.3],{
      icon:L.divIcon({html:`<div class="white" style="font-size:10px">${km}KM</div>`,className:''})
    }).addTo(circleGroup);
  });
  L.circleMarker(macau,{radius:2,color:'white',fillColor:'white',fillOpacity:1}).addTo(circleGroup);
  L.marker(macau,{icon:L.divIcon({html:'<div class="white" style="font-size:12px;font-weight:bold">Macau</div>',iconAnchor:[-5,0]})}).addTo(circleGroup);
  circleGroup.addTo(map);

  // 彩格
  gridGroup=L.layerGroup();
  for(let i=0;i<12;i++){
    for(let j=0;j<15;j++){
      const lat1=25-i, lat2=24-i, lon1=106+j, lon2=107+j;
      L.rectangle([[lat1,lon1],[lat2,lon2]], {
        color: 'none',
        fillColor: odvColor(numGrid[i][j]),
        fillOpacity: 0.75
      }).addTo(gridGroup);
    }
  }
  gridGroup.addTo(map);

  // 白字風向
  txtGroup=L.layerGroup();
  for(let i=0;i<12;i++){
    for(let j=0;j<15;j++){
      const lat=24.5-i, lon=106.5+j;
      L.marker([lat,lon],{
        icon:L.divIcon({
          html:`<span style="color:#fff;font-size:10px">${txtGrid[i][j]}</span>`,
          className:'',iconSize:null,iconAnchor:[0,0]
        })
      }).addTo(txtGroup);
    }
  }
  txtGroup.addTo(map);
}

/* === 下載 PNG === */
document.getElementById('pngBtn').addEventListener('click',()=>{
  html2canvas(document.getElementById('map'),{useCORS:true,backgroundColor:'#000'})
    .then(canvas=>{
      const a=document.createElement('a');
      a.download='TCtrack.png';
      a.href=canvas.toDataURL();
      a.click();
    });
});
